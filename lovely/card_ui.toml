[manifest]
version = "0.0.9"
priority = 0
dump_lua = true

[[patches]]
[patches.pattern]
target = '''=[SMODS _ "src/game_object.lua"]'''
pattern = '''
elseif desc_nodes ~= full_UI_table.main and not desc_nodes.name and self.set ~= 'Enhanced' then
    desc_nodes.name = localize{type = 'name_text', key = res.name_key or target.key, set = target.set }
'''
position = "after"
payload = '''
desc_nodes.name = Multiverse.parse_vars(desc_nodes.name, target.vars)
'''
match_indent = true

[[patches]]
[patches.pattern]
target = "tag.lua"
pattern = '''
G.HUD_tags[HUD_tag_key+1]:set_alignment({type = 'bri',
offset = {x=0.7,y=0},
xy_bond = 'Weak',
major = G.ROOM_ATTACH})
'''
position = "after"
payload = '''
if Multiverse.count_deck_enchantments() > 0 then
    G.HUD_tags[HUD_tag_key+1].config.offset.y = -0.9
end
'''
match_indent = true